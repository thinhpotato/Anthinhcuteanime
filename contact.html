    <div class="container">
        <h2>Gửi Tin Nhắn Cho Chúng Tôi</h2>
        <br>
        <form class="contact-form" action="#" method="get">
            <div class="form-group">
                <label for="name">Họ và Tên:</label>
                <input type="text" id="name" name="name" required placeholder="Nhập tên của bạn...">
            </div>
            <div class="form-group">
                <label for="email">Số Điện Thoại / Email:</label>
                <input type="text" id="email" name="email" required placeholder="Nhập SĐT hoặc Email...">
            </div>
            <div class="form-group">
                <label for="message">Nội Dung Góp Ý / Đặt Hàng:</label>
                <textarea id="message" name="message" rows="5" required placeholder="Nhập nội dung..."></textarea>
            </div>
            <button type="submit" class="btn">Gửi Liên Hệ</button>
        </form>
    </div>
